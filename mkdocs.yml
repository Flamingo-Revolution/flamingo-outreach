site_name: Outreach
theme:
  name: material
  language: en
  icon:
    logo: material/bullhorn
  palette:
    - scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
copyright: >
  Published by this project's volunteer contributors.
extra_css:
  - assets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js
  - assets/js/directory.js
  - assets/js/timeline.js
  - assets/js/media_coverage.js
  - assets/js/media_reports.js
  - assets/js/status_pages.js
  - assets/js/status_directory.js
  - assets/js/country_data.js
  - assets/js/country_report.js
  - assets/js/country_popup.js
  - assets/js/outreach_activity.js
  - assets/js/outreach_map.js
  - assets/js/institutions.js
  - assets/js/parties.js
  - assets/js/politicians.js
  - assets/js/actors.js
  - assets/js/remaining_treemaps.js
  - assets/js/outreach_directory.js
  - assets/js/education_map.js
  - assets/js/email_templates.js
  - assets/js/social_templates.js
  - assets/js/evidence_comparison.js
  - assets/js/momentum.js
  - assets/js/goal_select.js
  - https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.4/cytoscape.min.js
  - assets/js/network.js
plugins:
  - search
nav:

  - Home: index.md
  - Start: start.md
  - Contact:
      - Overview: contact/index.md
      - Editions:
          - English (EU): contact/eu.md
          - English (USA): contact/us.md
          - English (UK): contact/gb.md
      - Main languages:
          - German: contact/de.md
          - French: contact/fr.md
          - Italian: contact/it.md
          - Spanish: contact/es.md
          - Polish: contact/pl.md
      - Other languages:
          - Albanian: contact/sq.md
          - Bulgarian: contact/bg.md
          - Czech: contact/cs.md
          - Danish: contact/da.md
          - Dutch: contact/nl.md
          - Finnish: contact/fi.md
          - Greek: contact/el.md
          - Norwegian: contact/no.md
          - Portuguese: contact/pt.md
          - Romanian: contact/ro.md
          - Slovenian: contact/sl.md
          - Swedish: contact/sv.md
          - Turkish: contact/tr.md
          - Ukrainian: contact/uk.md
  - Status:
      - Directories:
          - Media: media-coverage.md
          - Institutions: institutions.md
          - Parties: parties.md
          - Politicians: politicians.md
          - Civil society: actors.md
      - Additional:
          - Network: network.md
          - Remaining: remaining.md
          - Momentum: momentum.md
  - Background:
      - Overview: background/index.md
      - Movement: background/context.md
      - Timeline: timeline.md
      - Academics: background/education-map.md
      - Safety: background/safety.md
      - Actions:
          - Overview: actions/index.md
          - Legal Action: actions/legal-action.md
          - Referendums: actions/referendums.md
          - Moratorium: actions/moratorium.md
          - Crowdfunding: actions/funding.md
          - Civic Projects: actions/civic-projects.md
          - Open Letter: actions/open-letters.md
      - Sources:
          - Evidence: background/evidence.md
          - Evidence comparison: background/evidence-comparison.md
          - Verification: background/sources.md
      - External:
          - Flamingo protest map ↗: https://pomodoren.github.io/flamingo-map/
          - Flamingo Revolution protests ↗: https://flamingorevolution.eu/protestat/
          - Violence archive ↗: https://hajdenshesh.com/dhuna
  - About: about.md

markdown_extensions:
  - admonition
  - md_in_html
  - tables
  - attr_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
